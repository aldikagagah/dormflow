# SonarQube configuration for DormFlow Mobile

# Project identification
sonar.projectKey=dormflow_mobile
sonar.projectName=DormFlow Mobile
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=lib
sonar.tests=test

# Exclude generated files and build artifacts
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,build/**,.dart_tool/**,**/*.mocks.dart,**/firebase_options.dart

# Test exclusions
sonar.test.exclusions=test/**

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage report path (generate with: flutter test --coverage)
sonar.dart.coverage.reportPath=coverage/lcov.info

# Additional analysis settings
sonar.scm.disabled=true
