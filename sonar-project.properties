# SonarQube Configuration for DormFlow Mobile
# Place this file in project root: D:\Dormflow_Apps\dormflow_mobile\

# Project identification
sonar.projectKey=dormflow-mobile
sonar.projectName=DormFlow Mobile
sonar.projectVersion=1.0.0

# Source code locations
sonar.sources=lib
sonar.tests=test,integration_test

# Source encoding
sonar.sourceEncoding=UTF-8

# Dart/Flutter specific
sonar.language=dart
sonar.dart.file.suffixes=.dart

# Exclusions - ignore generated files
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,**/*.mocks.dart,build/**,android/**,ios/**,web/**,linux/**,macos/**,windows/**

# Test exclusions
sonar.test.exclusions=test/**,integration_test/**

# Coverage report (optional - requires lcov)
# sonar.dart.coverage.reportPaths=coverage/lcov.info

# SonarQube server
sonar.host.url=http://localhost:9000

# Token (replace with your generated token)
sonar.token=sqp_f7473e9e9b80700d907b4c8c66790fbbcb41b966

# Quality gate wait
sonar.qualitygate.wait=true
