# SonarQube configuration for DormFlow Mobile

# Project identification
sonar.projectKey=dormflow-mobile
sonar.projectName=DormFlow-mobile
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=.

# Exclude generated files, build artifacts, platform folders, and Firebase config
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,build/**,.dart_tool/**,**/*.mocks.dart,**/firebase_options.dart,android/**,ios/**,linux/**,macos/**,windows/**,web/**,test/**,.idea/**,.git/**,.scannerwork/**

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage report paths - TRY MULTIPLE FORMATS
# Generic lcov path (works with many plugins)
sonar.coverageReportPaths=coverage/lcov_unix.info

# Dart-specific path (for SonarDart plugin)
sonar.dart.lcov.reportPaths=coverage/lcov_unix.info

# Alternative generic format
sonar.javascript.lcov.reportPaths=coverage/lcov_unix.info

# Disable SCM
sonar.scm.disabled=true
